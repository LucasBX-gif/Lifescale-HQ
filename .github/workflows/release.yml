name: Build Mac app

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "supabase/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Checks the update signing key is present and usable, and says so in the run summary.
      - name: Check signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          echo "::notice::Signing key length: ${#TAURI_SIGNING_PRIVATE_KEY} (expected 348)"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo test > /tmp/keytest.bin
          if ! npx tauri signer sign /tmp/keytest.bin > /tmp/keytest.log 2>&1; then
            echo "::error::Signing key is set but can't be used: $(tail -3 /tmp/keytest.log | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::Signing key works."

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Lifescale HQ v__VERSION__
          releaseBody: |
            Download the .dmg below, open it and drag Lifescale HQ into Applications.
            First launch: macOS will block it because it isn't from the App Store. See the README for the 20 second fix.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

      # If the build fails, rebuild once with the output captured so the error shows in the run summary.
      - name: Show build error
        if: failure() && steps.tauri.outcome == 'failure'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm run tauri build -- --target universal-apple-darwin > /tmp/build.log 2>&1 || true
          grep -iE "error|failed|panicked" /tmp/build.log | tail -15 | while IFS= read -r line; do echo "::error::$line"; done
          tail -25 /tmp/build.log
